spring.application.name=lab19

# MySQL connection (Aiven). Replace HOST, PORT, USERNAME and PASSWORD with the
# details from your Aiven service page. Use se411db (or defaultdb) as the database.
spring.datasource.url=jdbc:mysql://HOST:PORT/se411db?ssl-mode=REQUIRED
spring.datasource.username=USERNAME
spring.datasource.password=PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
